[project]
name = "neuralis-api"
version = "0.1.0"
description = "Instrumented CPU-first neural research runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "numpy==2.3.2",
  "torch==2.8.0",
  "safetensors==0.6.2",
  "psutil==7.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.9"]
lab = ["PyJWT[crypto]==2.10.1", "sqlalchemy==2.0.43", "psycopg[binary]==3.2.9", "boto3==1.40.11"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
