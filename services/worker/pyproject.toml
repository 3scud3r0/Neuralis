[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralis-worker"
version = "0.1.0"
description = "Authenticated bounded CPU worker for Neuralis laboratory jobs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
distributed = ["torch>=2.2"]

[project.scripts]
neuralis-worker = "neuralis_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralis_worker*"]
