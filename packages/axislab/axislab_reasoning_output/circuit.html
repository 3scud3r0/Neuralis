<!doctype html><html lang="pt-BR"><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title>AxisLab circuit map</title>
    <style>body{font-family:system-ui;background:#111923;color:#e6ecf6;max-width:1050px;margin:2rem auto;padding:0 1rem}
    svg{background:#192435;border-radius:10px;width:100%;height:auto}input{width:50%}</style>
    <h1>AxisLab circuit map</h1><p>Mapa exploratório de componentes. Arestas não são provas de causalidade sem intervenção e controles.</p>
    <label>Mostrar arestas com peso ≥ <span id="cutoff">0</span>
    <input id="threshold" type="range" min="0" max="1" step="0.01" value="0"></label>
    <svg viewBox="0 0 1000 310" role="img" aria-label="Mapa do circuito"><line class="edge" data-weight="1.00000000" x1="80.0" y1="110" x2="500.0" y2="110" stroke="#56a3da" stroke-opacity="0.5" stroke-width="4.00"><title>state → recurrent | weight=1.0000 | architectural | </title></line><line class="edge" data-weight="1.00000000" x1="500.0" y1="110" x2="920.0" y2="110" stroke="#56a3da" stroke-opacity="0.5" stroke-width="4.00"><title>recurrent → unembedding | weight=1.0000 | architectural | </title></line><g><rect x="14.0" y="90.0" width="132" height="40" rx="8" fill="#27374c" stroke="#6c98ca"/><text x="80.0" y="115.0" text-anchor="middle" fill="white" font-size="13">state</text><title>input: current state</title></g><g><rect x="434.0" y="90.0" width="132" height="40" rx="8" fill="#27374c" stroke="#6c98ca"/><text x="500.0" y="115.0" text-anchor="middle" fill="white" font-size="13">recurrent</text><title>transform: same block repeated 5 times</title></g><g><rect x="854.0" y="90.0" width="132" height="40" rx="8" fill="#27374c" stroke="#6c98ca"/><text x="920.0" y="115.0" text-anchor="middle" fill="white" font-size="13">unembedding</text><title>readout: vocabulary projection</title></g></svg>
    <script>const bar=document.getElementById('threshold');
    function update(){let t=Number(bar.value);document.getElementById('cutoff').textContent=t.toFixed(2);
      document.querySelectorAll('line.edge').forEach(x=>x.style.display=Number(x.dataset.weight)>=t?'':'none');}
    bar.addEventListener('input',update);update();</script></html>
