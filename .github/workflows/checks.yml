name: Quality checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.3'
      - run: uv sync --project services/api --frozen
      - run: uv run --project services/api pytest services/api/tests
  source-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/count-code.py --output docs/code-count.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-count
          path: docs/code-count.json
